<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ultimate Rugby League Manager</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2f5;background:#09151e}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#244254;color:#fff;font-weight:650}button.primary{background:var(--accent,#28b68e);color:#071b1b}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:900px;margin:auto;padding:18px 15px 95px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;letter-spacing:.06em;color:var(--accent,#39d6a6);font-size:12px}.sub{font-size:12px;color:#9ab0bc}.hero{margin:20px 0;padding:20px;background:linear-gradient(125deg,#173e4b,#10242f);border:1px solid #315466;border-radius:18px}.hero h1{font-size:27px;margin:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:#132630;border:1px solid #2a4550;border-radius:15px;padding:15px;margin:12px 0}.card h3{margin:0 0 12px}.muted{color:#9eb1bb}.pill{background:#244954;border-radius:30px;padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#0e1e27;padding:12px;border-radius:12px;text-align:center}.metric b{font-size:23px;display:block}.metric small{color:#9ab0bc}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0e2029;border-top:1px solid #35515b;display:flex;justify-content:center;z-index:3;padding-bottom:env(safe-area-inset-bottom)}.tabs button{background:transparent;font-size:12px;flex:1;max-width:160px;padding:15px 4px;color:#a7bac5}.tabs button.active{color:#3bd6aa;background:#183c40}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #28404b}.item:last-child{border:0}.num{width:27px;color:#80a6b7;font-size:12px}.grow{flex:1;min-width:0}.name{font-weight:650}.mini{font-size:12px;color:#9db2bf}.rating{font-weight:850;color:var(--accent,#51ddb1)}.notice{background:#283c30;border:1px solid #477a5d;border-radius:12px;padding:12px;font-size:13px}.warn{background:#423524;border-color:#82663b}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 6px;border-bottom:1px solid #29434f;text-align:left}th{color:#8caab7}td:last-child,th:last-child{text-align:right}select{background:#173440;color:#fff;padding:10px;border:1px solid #4b6773;border-radius:10px;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{text-align:center;padding:22px;color:#b2c2c9}.tiny{font-size:11px}.section{margin:24px 0 8px}.draft{border-left:3px solid #3ad3a3;padding:9px 12px;background:#142d34;margin:8px 0}.label{color:#a6c0c9;font-size:12px}.selectrow{display:flex;gap:8px;align-items:center}.selectrow select{flex:1}#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#245a4e;border-radius:10px;padding:12px 18px;display:none;z-index:9;max-width:90vw}
.finalgame{border:1px solid #315563;border-radius:12px;padding:12px;margin:8px 0;background:#102934}.finalgame.done{border-color:#367e68}.finalgame .score{font-size:18px;font-weight:800;color:#5ce2b6}.ranking{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #29434f}.ranking:last-child{border:0}.tabs{overflow-x:auto;justify-content:flex-start}.tabs button{min-width:72px;max-width:none}.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.choice button{text-align:left;min-height:70px;border:1px solid #3b626b}.tag{font-size:11px;color:#9db2bf}.mini-table td,.mini-table th{padding:7px 5px}.up{color:#54dca4}.down{color:#f28a83}.card button{margin-top:3px}.profile{border:1px solid #35535e;border-radius:10px;padding:9px;margin-top:6px}.bar{height:6px;background:#29434f;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent,#28b68e)}
</style></head><body><div id="toast"></div><div id="app" class="shell"></div><nav id="tabs" class="tabs"></nav><script>
'use strict';
const CLUBS=['Brisbane Broncos','Canberra Raiders','Canterbury Bulldogs','Cronulla Sharks','Dolphins','Gold Coast Titans','Manly Sea Eagles','Melbourne Storm','Newcastle Knights','North Queensland Cowboys','Parramatta Eels','Penrith Panthers','South Sydney Rabbitohs','St George Illawarra Dragons','Sydney Roosters','New Zealand Warriors','Wests Tigers'];
const POS=['FB','WG','CE','CE','WG','FE','HB','PR','HK','PR','SR','SR','LK'];const BENCH=['PR','PR','HK','SR','HB','WG','CE','FB'];const FIRST=['Liam','Noah','Jack','Cooper','Tane','Kai','Ethan','Isaiah','Tama','Sione','Mason','Lucas','Jayden','Riley','Kauri','Oliver','Harry','James','Mitchell','Aiden','Finn','Dylan','Logan','Samuel','Jai','Tyler','Cody','Tevita','Malakai','Josh','Leo'];const LAST=['Williams','Thompson','Ropata','Mitchell','Walker','Harris','Faavae','Martin','Cooper','Wilson','Reid','Tupou','Smith','Brown','Johnson','Murray','Walsh','Katoa','Hughes','Tavita','Marshall','Fisher','Papalii','Young','Bennett','Talakai','Hunt','Moore'];
const KEY='urlm_v01_save';let g=null,tab='home';const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[r(0,a.length-1)];const fmt=n=>Math.round(n).toLocaleString('en-NZ');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const club=i=>g.clubs[i];const teamPlayers=i=>g.players.filter(p=>p.club===i&&p.level==='senior');const academy=i=>g.players.filter(p=>p.club===i&&p.level==='academy');const overall=p=>Math.round(p.ovr);const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x.ovr,0)/a.length):0;
const POSITIONS=['FB','WG','CE','FE','HB','PR','HK','SR','LK'];
const SECOND={FB:['WG','CE'],WG:['FB','CE'],CE:['WG','SR'],FE:['HB','FB'],HB:['FE','HK'],PR:['LK','SR'],HK:['HB','LK'],SR:['LK','CE','PR'],LK:['SR','PR','HK']};
const ATTR=['Running','Passing','Playmaking','Kicking','Goal Kicking','Tackling','Awareness','Speed','Strength','Stamina','Agility','Rugby IQ'];
const WEIGHTS={FB:[2,2,3,1,0,2,3,4,1,2,4,3],WG:[3,0,0,0,0,2,2,5,2,2,4,1],CE:[3,1,1,0,0,3,2,4,3,2,3,2],FE:[2,4,5,4,1,1,2,3,0,2,3,4],HB:[1,5,5,5,1,1,2,2,0,2,2,5],PR:[3,0,0,0,0,4,3,0,5,4,0,2],HK:[2,5,4,2,0,4,3,3,1,4,3,4],SR:[3,1,1,0,0,4,3,2,4,4,2,2],LK:[3,2,2,0,0,5,4,2,4,4,1,3]};
const ARCH={FB:['Support Runner','Ball-Playing Fullback','Defensive Fullback'],WG:['Finisher','Aerial Threat','Power Winger'],CE:['Strike Centre','Defensive Centre','Power Centre'],FE:['Running Five-eighth','Creative Five-eighth'],HB:['Organising Playmaker','Running Half','Tactical Kicker'],PR:['Power Prop','Mobile Prop','Defensive Enforcer'],HK:['Running Hooker','Creative Distributor','Defensive Hooker'],SR:['Edge Runner','Defensive Workhorse','Line Breaker'],LK:['Ball-Playing Lock','Middle Enforcer','Mobile Lock']};
const COLOURS=[['#f0b34b','#7b162e'],['#92cb71','#234d31'],['#72c5f6','#174f8b'],['#8cc8dd','#174a67'],['#e4a350','#b52630'],['#f2c44d','#2860a2'],['#b5d3e3','#6b1837'],['#e8bc58','#54258c'],['#ef5758','#164a78'],['#e9bc48','#214b8b'],['#f0c14e','#2450a0'],['#f4c856','#222222'],['#72e0a1','#17683d'],['#f0c652','#bd262d'],['#e95862','#1d4b8c'],['#4bcb8d','#1969b5'],['#f0b95d','#db6b23']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tier=ovr=>ovr>=94?'Golden Boot':ovr>=88?'International':ovr>=83?'Origin':ovr>=78?'Dally M':ovr>=70?'Starter':ovr>=60?'Bench':'Developmental';
function ratingAt(p,pos){if(pos!==p.pos&&pos!==p.secondary)return null;if(!p.attrs)return pos===p.pos?p.ovr:Math.max(35,p.ovr-3);let w=WEIGHTS[pos],sum=w.reduce((a,b)=>a+b,0);let v=Math.round(p.attrs.reduce((a,x,i)=>a+x*w[i],0)/sum);return clamp(v-(pos===p.secondary?3:0),35,99)}
function ensurePlayer(p){if(!('secondary'in p))p.secondary=Math.random()<.3?pick(SECOND[p.pos]||[]):null;if(!p.archetype)p.archetype=pick(ARCH[p.pos]||['All-Rounder']);if(!p.attrs){let w=WEIGHTS[p.pos]||WEIGHTS.FB;let mean=w.reduce((a,b)=>a+b,0)/w.length;p.attrs=ATTR.map((_,i)=>clamp(Math.round(p.ovr+(w[i]-mean)*3+r(-7,7)),15,99));let calc=ratingAt(p,p.pos),shift=p.ovr-calc;p.attrs=p.attrs.map(v=>clamp(v+shift,15,99));}p.ovr=ratingAt(p,p.pos);return p}
function leagueSnapshot(){return ladder().map((c,i)=>({id:c.id,rank:i+1,pts:c.pts,w:c.w,l:c.l,delta:c.pf-c.pa}))}
function updateTheme(){let colors=COLOURS[g.user]||COLOURS[15];document.documentElement.style.setProperty('--accent',colors[0]);document.documentElement.style.setProperty('--team',colors[1]);}
function miniLadder(){let all=ladder();return `<div class="card"><div class="row"><h3>NRL Ladder</h3><button onclick="switchTab('league')">Full ladder</button></div><div class="scroll"><table class="mini-table"><tr><th>#</th><th>Club</th><th>W</th><th>L</th><th>+/-</th><th>Pts</th></tr>${all.filter((c,i)=>i<8||c.id===g.user).map(c=>`<tr style="${c.id===g.user?'background:#244c4c':''}"><td>${all.indexOf(c)+1}</td><td>${esc(c.name)}</td><td>${c.w}</td><td>${c.l}</td><td>${c.pf-c.pa}</td><td>${c.pts}</td></tr>`).join('')}</table></div></div>`}
function startCareer(id){g.user=Number(id);g.started=true;save();render()}
function clubSelection(){return `<div class="hero"><div class="sub">NEW CAREER · ${g.year}</div><h1>Choose your NRL club</h1><p>Every club has a fictional squad. Select your franchise to begin.</p></div><div class="choice">${g.clubs.map(c=>`<button onclick="startCareer(${c.id})" style="border-left:5px solid ${COLOURS[c.id][0]}"><b>${esc(c.name)}</b><div class="tag">Squad strength ${Math.round(strength(c.id))} · Academy ${academy(c.id).length}/17</div></button>`).join('')}</div>`}
function reportView(){let data=g.developmentReport||[];return `<h2>Player Development</h2><p class="muted">Changes from the most recent offseason. Natural OVR is calculated from individual attributes.</p>${!data.length?'<div class="card">Complete a season and advance through the offseason to see progression.</div>':`<div class="grid"><div class="metric"><b class="up">${data.filter(x=>x.change>0).length}</b><small>Improved</small></div><div class="metric"><b>${data.filter(x=>x.change===0).length}</b><small>Stable</small></div><div class="metric"><b class="down">${data.filter(x=>x.change<0).length}</b><small>Regressed</small></div></div><div class="card scroll"><table><tr><th>Player</th><th>Age</th><th>Before</th><th>Now</th><th>+/-</th></tr>${data.sort((a,b)=>b.change-a.change).map(x=>`<tr><td>${esc(x.name)} <span class="mini">${x.pos}</span></td><td>${x.age}</td><td>${x.before}</td><td>${x.after}</td><td class="${x.change>0?'up':x.change<0?'down':''}">${x.change>0?'+':''}${x.change}</td></tr>`).join('')}</table></div>`}`}
function signAcademy(id){let p=g.players.find(x=>x.id===id);if(!p||p.level!=='free'||academy(g.user).length>=17)return;p.club=g.user;p.level='academy';p.salary=0;p.years=0;save();render()}
function freeView(){let available=g.players.filter(p=>p.level==='free').sort((a,b)=>b.ovr-a.ovr);return `<h2>Free Agency</h2><p class="muted">Sign available senior players or recruit unsigned prospects to your academy.</p><div class="card"><h3>Unsigned players (${available.length})</h3>${available.slice(0,75).map(p=>rowPlayer(p,`<button onclick="signFree(${p.id})" ${teamPlayers(g.user).length>=21?'disabled':''}>Senior</button><button onclick="signAcademy(${p.id})" ${academy(g.user).length>=17?'disabled':''}>Academy</button>`)).join('')||'<p>No available players.</p>'}</div>`}
function showProfile(id){let p=g.players.find(x=>x.id===id);if(!p)return;let target=document.getElementById('profile-'+id);if(!target)return;target.innerHTML=target.innerHTML?'':`<div class="profile"><div class="mini">${esc(p.archetype)} · ${esc(tier(p.ovr))} · Primary ${p.pos}${p.secondary?' · Secondary '+p.secondary:''}</div><div class="mini">Effective OVR: ${p.pos} ${ratingAt(p,p.pos)}${p.secondary?' / '+p.secondary+' '+ratingAt(p,p.secondary):''}</div>${ATTR.map((a,i)=>`<div class="row mini"><span>${a}</span><b>${p.attrs[i]}</b></div><div class="bar"><span style="width:${p.attrs[i]}%"></span></div>`).join('')}</div>`}

function player(ci,pos,level='senior'){const age=level==='academy'?r(17,20):r(19,34),ovr=level==='academy'?r(43,67):r(59,89);let p={id:g.nextId++,name:pick(FIRST)+' '+pick(LAST),pos,age,ovr,potential:Math.min(98,Math.max(ovr,r(ovr-4,Math.min(98,ovr+(level==='academy'?32:20))))),club:ci,level,salary:level==='academy'?0:r(140,950)*1000,years:level==='academy'?0:r(1,4),games:0,tries:0,points:0,selected:false};return ensurePlayer(p)}

function fresh(){g={year:2026,nextId:1,clubs:CLUBS.map((name,id)=>({id,name,w:0,l:0,d:0,pf:0,pa:0,pts:0})),players:[],fixtures:[],round:0,phase:'season',champion:null,history:[],draft:[],draftIndex:0,user:15,started:false,log:[],lastResult:null,developmentReport:[],academyStandings:CLUBS.map(()=>({w:0,l:0,pf:0,pa:0}))};for(let ci=0;ci<17;ci++){[...POS,...BENCH].forEach((pos,j)=>{let p=player(ci,pos);p.selected=j<13;g.players.push(p)});[...POS,...['PR','HK','SR','WG']].forEach(pos=>g.players.push(player(ci,pos,'academy')))}schedule();save()}

function schedule(){g.fixtures=[];let teams=Array.from({length:17},(_,i)=>i).concat([-1]);for(let round=0;round<17;round++){let games=[];for(let i=0;i<9;i++){let a=teams[i],b=teams[17-i];if(a>=0&&b>=0)games.push({a,b,sa:null,sb:null})}g.fixtures.push(games);teams=[teams[0],teams[17],...teams.slice(1,17)];}g.round=0;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){console.warn('Save unavailable',e)}}function load(){try{let raw=localStorage.getItem(KEY);if(raw){g=JSON.parse(raw);if(!g.clubs||!g.players||!g.fixtures)throw Error('bad save');g.players.forEach(ensurePlayer);if(g.started===undefined)g.started=true;if(!g.developmentReport)g.developmentReport=[];if(!g.academyStandings)g.academyStandings=CLUBS.map(()=>({w:0,l:0,pf:0,pa:0}));return true}}catch(e){console.warn('Invalid save',e)}return false}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2200)}
function starters(ci){let ps=teamPlayers(ci);let selected=ps.filter(p=>p.selected);if(selected.length!==13)return [...ps].sort((a,b)=>b.ovr-a.ovr).slice(0,13);return selected}
function strength(ci){let s=starters(ci);return avg(s)*.8+avg(teamPlayers(ci))*.2}
function scoreMatch(a,b,knockout=false){let diff=(strength(a)-strength(b))*0.55+r(-11,11),sa=Math.max(0,Math.round((20+diff+r(-10,10))/2)*2),sb=Math.max(0,Math.round((20-diff+r(-10,10))/2)*2);let gp=false,extra=0;if(sa===sb){gp=true;let attempts=knockout?40:10;for(let i=0;i<attempts;i++){if(Math.random()<.18){extra=pick([1,1,1,2,4]);if(Math.random()<.5)sa+=extra;else sb+=extra;break}}if(knockout&&sa===sb){if(Math.random()<.5)sa++;else sb++;extra=1}}return {a,b,sa,sb,gp,extra};}
function simulateMatch(a,b){let m=scoreMatch(a,b);let {sa,sb}=m,ca=club(a),cb=club(b);ca.pf+=sa;ca.pa+=sb;cb.pf+=sb;cb.pa+=sa;if(sa>sb){ca.w++;cb.l++;ca.pts+=2}else if(sb>sa){cb.w++;ca.l++;cb.pts+=2}else{ca.d++;cb.d++;ca.pts++;cb.pts++}recordPlayerStats(m);return m}
function recordPlayerStats(m){for(let [ci,score] of [[m.a,m.sa],[m.b,m.sb]]){let ps=starters(ci);ps.forEach(p=>p.games++);let tries=Math.max(0,Math.floor(score/6));for(let t=0;t<tries;t++){let p=pick(ps);p.tries++;p.points+=4}let kicker=ps.find(p=>p.pos==='HB')||ps[0];kicker.points+=Math.max(0,score-tries*4)}}
function ladder(){return [...g.clubs].sort((a,b)=>b.pts-a.pts||((b.pf-b.pa)-(a.pf-a.pa))||b.pf-a.pf)}
function simulateRound(){if(g.phase!=='season')return;if(g.round>=g.fixtures.length)return;let games=g.fixtures[g.round];games.forEach(m=>{Object.assign(m,simulateMatch(m.a,m.b));let sa=Math.max(0,Math.round((18+(avg(academy(m.a))-avg(academy(m.b)))*.35+r(-12,12))/2)*2),sb=Math.max(0,Math.round((18+(avg(academy(m.b))-avg(academy(m.a)))*.35+r(-12,12))/2)*2);m.aa=sa;m.ab=sb;for(let [ci,sc,opp] of [[m.a,sa,sb],[m.b,sb,sa]]){let t=g.academyStandings[ci];t.pf+=sc;t.pa+=opp;if(sc>opp)t.w++;else if(sc<opp)t.l++;academy(ci).forEach(p=>{p.academyGames=(p.academyGames||0)+1;if(Math.random()<.25)p.academyTries=(p.academyTries||0)+1})}});g.round++;let my=games.find(m=>m.a===g.user||m.b===g.user);g.lastResult=my;if(g.round===17){g.phase='finals';setupFinals();g.log.unshift('Regular season finished. Finals ready!')}save();render()}
function setupFinals(){if(g.finals&&g.finals.year===g.year)return;let top=ladder().slice(0,8).map(c=>c.id);g.finals={year:g.year,week:0,games:[[{a:top[0],b:top[3],label:'Qualifying Final 1',sa:null,sb:null},{a:top[1],b:top[2],label:'Qualifying Final 2',sa:null,sb:null},{a:top[4],b:top[7],label:'Elimination Final 1',sa:null,sb:null},{a:top[5],b:top[6],label:'Elimination Final 2',sa:null,sb:null}],[],[],[]]};}
function winner(m){return m.sa>m.sb?m.a:m.b}function loser(m){return m.sa>m.sb?m.b:m.a}
function nextFinal(){if(!g.finals)return null;return g.finals.games.flat().find(m=>m.sa===null)||null}
function advanceFinals(){let f=g.finals,w=f.week,round=f.games[w];if(round.some(m=>m.sa===null))return;let M=(a,b,label)=>({a,b,label,sa:null,sb:null});if(w===0){let [q1,q2,e1,e2]=round;f.games[1]=[M(loser(q1),winner(e2),'Semi Final 1'),M(loser(q2),winner(e1),'Semi Final 2')]}else if(w===1){let [q1,q2]=f.games[0], [s1,s2]=round;f.games[2]=[M(winner(q1),winner(s2),'Preliminary Final 1'),M(winner(q2),winner(s1),'Preliminary Final 2')]}else if(w===2){f.games[3]=[M(winner(round[0]),winner(round[1]),'Grand Final')]}else if(w===3){g.champion=winner(round[0]);g.history.push({year:g.year,champion:g.champion,ladder:ladder().map(c=>c.id)});g.phase='draft';createDraft();g.log.unshift(`${club(g.champion).name} win the ${g.year} premiership!`);return}f.week++;g.log.unshift(`Finals Week ${f.week+1} fixtures confirmed.`)}
function simulateNextFinal(){if(g.phase!=='finals')return;setupFinals();let m=nextFinal();if(!m)return;Object.assign(m,scoreMatch(m.a,m.b,true));recordPlayerStats(m);g.lastResult=m;g.log.unshift(`${m.label}: ${club(m.a).name} ${m.sa}–${m.sb} ${club(m.b).name}${m.gp?' (Golden Point)':''}`);advanceFinals();save();render()}
function simulateFinalsWeek(){if(g.phase!=='finals')return;setupFinals();let w=g.finals.week;while(g.phase==='finals'&&g.finals.week===w)simulateNextFinal()}
function simulateFinals(){simulateNextFinal()}
function createDraft(){let counts={FB:15,WG:24,CE:24,FE:15,HB:15,PR:32,HK:15,SR:26,LK:15};g.draft=[];if(!g.talentSchedule)g.talentSchedule={};for(let pos of POSITIONS){let due=g.talentSchedule[pos]||{};for(let i=0;i<counts[pos];i++){let p=player(-1,pos,'academy');p.age=r(17,20);p.ovr=r(43,69);p.level='draft';p.club=-1;p.selected=false;p.potential=clamp(p.ovr+r(4,17),p.ovr,82);g.draft.push(p)}for(let [name,count,lo,hi,frequency] of [['Golden Boot',1,94,99,[3,4]],['International',2,88,93,[3,5]],['Origin',2,83,87,[2,3]],['Dally M',1,78,82,[1,1]],['Starter',2,70,77,[1,1]]]){let key=name.replace(' ','');if(!due[key])due[key]=g.year+r(0,frequency[1]-1);if(g.year>=due[key]){let eligible=g.draft.filter(p=>p.pos===pos&&!p.rare);for(let j=0;j<count&&eligible.length;j++){let p=eligible.splice(r(0,eligible.length-1),1)[0];p.potential=r(lo,hi);p.rare=name}due[key]=g.year+r(...frequency)}}g.talentSchedule[pos]=due}g.draft.sort((a,b)=>(b.ovr+b.potential*.4)-(a.ovr+a.potential*.4));g.players.push(...g.draft);g.draftIndex=0;let order=[...ladder()].reverse().map(c=>c.id);g.draftOrder=[...order,...order];g.draftPicks=[]}

function makePick(id){if(g.phase!=='draft'||g.draftIndex>=34)return;let ci=g.draftOrder[g.draftIndex],p=g.draft.find(p=>p.id===id&&p.level==='draft');if(!p)return;if(academy(ci).length>=17){let old=[...academy(ci)].sort((a,b)=>a.potential-b.potential)[0];if(!old)return;old.level='free';old.club=-1}p.club=ci;p.level='academy';g.draftPicks.push({pick:g.draftIndex+1,club:ci,name:p.name,pos:p.pos,ovr:p.ovr});g.draftIndex++;if(g.draftIndex===34){g.phase='offseason';g.draft.filter(x=>x.level==='draft').forEach(x=>x.level='free');g.log.unshift('Two-round draft complete. Undrafted prospects are available in Free Agency.')}save();render()}

function autoPick(){if(g.phase!=='draft')return;let ci=g.draftOrder[g.draftIndex],pros=g.draft.filter(p=>p.level==='draft');let needs=POS.filter(pos=>!academy(ci).some(p=>p.pos===pos));pros.sort((a,b)=>(b.ovr+b.potential*.6+(needs.includes(b.pos)?5:0))-(a.ovr+a.potential*.6+(needs.includes(a.pos)?5:0)));if(pros[0])makePick(pros[0].id)}
function simToUser(){if(g.phase!=='draft')return;let n=0;while(g.phase==='draft'&&g.draftOrder[g.draftIndex]!==g.user&&n++<34)autoPick();render()}
function offseason(){if(g.phase!=='offseason')return;let report=[];for(let p of g.players){if(p.level==='draft'){p.level='free';continue}if(p.level==='free'){if(p.age<24&&Math.random()<.5){p.age++;p.attrs=p.attrs.map(v=>clamp(v+r(-1,2),20,99));p.ovr=ratingAt(p,p.pos)}continue}if(p.level==='retired')continue;let before=p.ovr;p.age++;if(p.age>=35||(p.age>=32&&Math.random()<.16)||(p.level==='academy'&&p.age>23)){p.level='retired';p.club=-1;continue}let delta=p.age<23?r(0,4):p.age<28?r(-1,2):p.age<31?r(-2,1):r(-4,0);if(p.level==='academy')delta+=r(0,2);let target=clamp(before+delta,35,p.potential);let shift=target-before;p.attrs=p.attrs.map(v=>clamp(v+shift+r(-1,1),15,99));p.ovr=ratingAt(p,p.pos);if(p.club===g.user)report.push({name:p.name,pos:p.pos,age:p.age,before,after:p.ovr,change:p.ovr-before});if(p.level==='senior'){p.years--;if(p.years<=0){p.years=r(1,3);p.salary=Math.round((p.ovr*8+r(-100,160))*1000)}}}for(let ci=0;ci<17;ci++){let ps=teamPlayers(ci);while(ps.length<21){let a=academy(ci).sort((x,y)=>y.ovr-x.ovr)[0];if(a&&a.ovr>=57){a.level='senior';a.years=2;a.salary=130000;ps.push(a)}else{let f=player(ci,pick(POS));g.players.push(f);ps.push(f)}}if(ps.length>21){ps.sort((a,b)=>b.ovr-a.ovr);for(let p of ps.slice(21)){p.level='free';p.club=-1}}let chosen=ps.sort((a,b)=>b.ovr-a.ovr).slice(0,13);ps.forEach(p=>p.selected=chosen.includes(p));while(academy(ci).length<17){let needed=POS.find(pos=>!academy(ci).some(p=>p.pos===pos));let candidates=g.players.filter(p=>p.level==='free'&&p.age<=22&&(!needed||p.pos===needed||p.secondary===needed)).sort((a,b)=>b.potential-a.potential);let p=candidates[0];if(!p){p=player(ci,needed||pick(POS),'academy');g.players.push(p)}else{p.club=ci;p.level='academy'}}}g.developmentReport=report;g.year++;g.clubs.forEach(c=>{c.w=0;c.l=0;c.d=0;c.pf=0;c.pa=0;c.pts=0});g.academyStandings=CLUBS.map(()=>({w:0,l:0,pf:0,pa:0}));g.phase='season';g.champion=null;g.draft=[];g.finals=null;g.lastResult=null;schedule();g.log.unshift(`Welcome to the ${g.year} season. Development report is ready.`);save();tab='development';render()}

function toggle(id){let p=g.players.find(p=>p.id===id);if(!p||p.club!==g.user||p.level!=='senior')return;let ps=teamPlayers(g.user),sel=ps.filter(x=>x.selected);if(!p.selected&&sel.length>=13){toast('Select only 13 starters. Deselect someone first.');return}p.selected=!p.selected;save();render()}
function promote(id){let p=g.players.find(p=>p.id===id);if(!p||p.club!==g.user||p.level!=='academy')return;if(teamPlayers(g.user).length>=21){toast('Senior squad full. Release a player first.');return}p.level='senior';p.salary=130000;p.years=2;p.selected=false;save();render()}
function release(id){let p=g.players.find(p=>p.id===id);if(!p||p.club!==g.user||p.level!=='senior')return;if(!confirm(`Release ${p.name}?`))return;p.level='free';p.club=-1;save();render()}
function signFree(id){let p=g.players.find(p=>p.id===id);if(!p||p.level!=='free'||teamPlayers(g.user).length>=21)return;p.club=g.user;p.level='senior';p.salary=Math.max(120000,p.ovr*8000);p.years=2;p.selected=false;save();render()}
function rowPlayer(p,actions=''){return `<div class="item"><span class="num">${esc(p.pos)}${p.secondary?'/'+esc(p.secondary):''}</span><div class="grow"><div class="name" onclick="showProfile(${p.id})" style="cursor:pointer">${esc(p.name)} ▾</div><div class="mini">Age ${p.age} · ${esc(p.archetype||'')} · ${p.years?p.years+' yr · ':''}${p.level==='senior'?'$'+fmt(p.salary):'Scouted OVR '+p.ovr}</div><div id="profile-${p.id}"></div></div><span class="rating">${p.ovr}</span>${actions}</div>`}

function home(){let c=club(g.user),my=g.lastResult;return `<div class="hero"><div class="sub">SEASON ${g.year} · ${g.phase.toUpperCase()}</div><h1>${esc(c.name)}</h1><div class="sub">${c.w}W · ${c.l}L · ${c.d}D &nbsp; | &nbsp; Round ${Math.min(g.round+1,17)}/17</div></div><div class="grid"><div class="metric"><b>${avg(starters(g.user))}</b><small>Starting OVR</small></div><div class="metric"><b>${teamPlayers(g.user).length}/21</b><small>Senior</small></div><div class="metric"><b>${academy(g.user).length}/17</b><small>Academy</small></div></div>${my?`<div class="card"><h3>Last match</h3><div class="row"><b>${esc(club(my.a).name)}</b><b>${my.sa} – ${my.sb}</b><b>${esc(club(my.b).name)}</b></div></div>`:''}<div class="card"><h3>Next action</h3>${g.phase==='season'?`<p class="muted">Simulate round ${g.round+1} of 17.</p><div class="actions"><button class="primary" onclick="simulateRound()">Simulate next round</button><button onclick="while(g.phase==='season')simulateRound()">Sim to finals</button></div>`:g.phase==='finals'?`<p>${nextFinal()?esc(nextFinal().label)+': '+esc(club(nextFinal().a).name)+' vs '+esc(club(nextFinal().b).name):'Finals ready'}</p><div class="actions"><button class="primary" onclick="simulateNextFinal()">Simulate next finals match</button><button onclick="switchTab('finals')">View finals bracket</button><button onclick="simulateFinalsWeek()">Simulate current week</button></div>`:g.phase==='draft'?`<p>The annual draft is underway. Every club receives two picks.</p><button class="primary" onclick="switchTab('draft')">Open draft</button>`:`<p>Draft complete. Progress players, age rosters and start ${g.year+1}.</p><button class="primary" onclick="offseason()">Begin next season</button>`}</div>${miniLadder()}<div class="card"><h3>Club news</h3>${g.log.length?g.log.slice(0,5).map(x=>`<p class="mini">${esc(x)}</p>`).join(''):'<p class="muted">Your franchise story begins here.</p>'}</div><div class="card"><h3>Career history</h3>${g.history.length?g.history.slice().reverse().map(x=>`<div class="item"><span>${x.year}</span><div class="grow name">${esc(club(x.champion).name)}</div><span class="pill">Premiers</span></div>`).join(''):'<p class="muted">No completed seasons yet.</p>'}</div><div class="actions"><button onclick="downloadSave()">Export save</button><button onclick="resetGame()">New career</button></div>`}
function squad(){let ps=teamPlayers(g.user);return `<h2>Senior Squad</h2><p class="muted">${ps.length}/21 players · ${ps.filter(p=>p.selected).length}/13 starters · Tap Select to change the starting lineup.</p><div class="card"><h3>Starting 13</h3>${ps.filter(p=>p.selected).map(p=>rowPlayer(p,`<button onclick="toggle(${p.id})">Remove</button>`)).join('')||'<p class="empty">No starters selected</p>'}</div><div class="card"><h3>Extended bench</h3>${ps.filter(p=>!p.selected).map(p=>rowPlayer(p,`<button onclick="toggle(${p.id})">Select</button><button onclick="release(${p.id})">✕</button>`)).join('')||'<p class="empty">No reserves</p>'}</div><p class="mini">Prototype note: positions affect the roster but are not yet enforced in starting lineup selection. The match engine uses team strength, not detailed set-by-set events.</p>`}
function academyView(){let a=academy(g.user),order=[...g.academyStandings].map((x,id)=>({...x,id})).sort((x,y)=>(y.w*2-y.l)-(x.w*2-x.l)||((y.pf-y.pa)-(x.pf-x.pa)));return `<h2>Academy Competition</h2><p class="muted">17-player academy squads. Matches simulate automatically alongside first grade. Player development is calculated in the offseason.</p><div class="card"><div class="row"><h3>Your Academy</h3><span class="pill">${a.length}/17</span></div>${a.map(p=>rowPlayer(p,`<button onclick="promote(${p.id})" ${teamPlayers(g.user).length>=21?'disabled':''}>Promote</button>`)).join('')}</div><div class="card scroll"><h3>Academy Ladder</h3><table><tr><th>#</th><th>Club</th><th>W</th><th>L</th><th>+/-</th></tr>${order.map((x,i)=>`<tr style="${x.id===g.user?'background:#244c4c':''}"><td>${i+1}</td><td>${esc(club(x.id).name)}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf-x.pa}</td></tr>`).join('')}</table></div></div>`}

function league(){let sorted=ladder();return `<h2>NRL Ladder · ${g.year}</h2><div class="card scroll"><table><thead><tr><th>#</th><th>Club</th><th>W</th><th>L</th><th>+/-</th><th>Pts</th></tr></thead><tbody>${sorted.map((c,i)=>`<tr style="${c.id===g.user?'background:#1b4544':''}"><td>${i+1}</td><td>${esc(c.name)}</td><td>${c.w}</td><td>${c.l}</td><td>${c.pf-c.pa}</td><td>${c.pts}</td></tr>`).join('')}</tbody></table></div><h3>Preseason power rankings</h3><div class="card">${[...g.clubs].sort((a,b)=>strength(b.id)-strength(a.id)).map((c,i)=>`<div class="ranking"><span>${i+1}. ${esc(c.name)}</span><span class="rating">${Math.round(strength(c.id))} OVR</span></div>`).join('')}</div><h3>Fixtures & results</h3>${g.fixtures.map((matches,i)=>`<div class="card"><div class="row"><b>Round ${i+1}</b><span class="mini">${i<g.round?'Complete':'Upcoming'}</span></div>${matches.map(m=>`<div class="item"><span class="grow mini">${esc(club(m.a).name)} vs ${esc(club(m.b).name)}</span><b>${m.sa===null?'–':m.sa+' : '+m.sb}</b></div>`).join('')}</div>`).join('')}`}
function finalsView(){if(!g.finals){return `<h2>NRL Finals</h2><div class="card"><p class="muted">The top eight finals bracket will appear after the regular season.</p></div>`}let f=g.finals,names=['Week 1 · Qualifying & Elimination','Week 2 · Semi Finals','Week 3 · Preliminary Finals','Week 4 · Grand Final'];return `<h2>${g.year} NRL Finals</h2><p class="muted">Each match is simulated separately. Knockout matches cannot finish tied.</p>${f.games.map((week,i)=>`<div class="card"><h3>${names[i]}</h3>${week.length?week.map(m=>`<div class="finalgame ${m.sa!==null?'done':''}"><div class="mini">${esc(m.label)}</div><div class="row"><span class="grow">${esc(club(m.a).name)}</span><span class="score">${m.sa===null?'–':m.sa}</span></div><div class="row"><span class="grow">${esc(club(m.b).name)}</span><span class="score">${m.sb===null?'–':m.sb}</span></div>${m.sa!==null?`<div class="mini">Winner: ${esc(club(winner(m)).name)}${m.gp?' · Golden Point':''}</div>`:''}</div>`).join(''):'<p class="muted">Awaiting earlier results.</p>'}</div>`).join('')}${g.phase==='finals'?`<div class="actions"><button class="primary" onclick="simulateNextFinal()">Simulate next match</button><button onclick="simulateFinalsWeek()">Simulate current week</button></div>`:g.champion!==null?`<div class="notice">🏆 ${esc(club(g.champion).name)} are the ${g.year} premiers!</div>`:''}`}
function draftView(){if(g.phase!=='draft'&&g.phase!=='offseason')return `<h2>Annual Draft</h2><div class="card"><p>Scouting opens after the Grand Final. Two rounds, 34 picks, and a large position-balanced class.</p></div>`;let ci=g.draftOrder[g.draftIndex],turn=ci===g.user,available=g.draft.filter(p=>p.level==='draft');return `<h2>${g.year} NRL Draft</h2><div class="card"><div class="row"><b>${g.phase==='draft'?'Pick '+(g.draftIndex+1)+' / 34':'Draft complete'}</b><span class="pill">Round ${Math.min(2,Math.floor(g.draftIndex/17)+1)} / 2</span></div>${g.phase==='draft'?`<p>${esc(club(ci).name)} on the clock ${turn?'(YOUR PICK)':''}</p><div class="actions">${turn?'':`<button class="primary" onclick="simToUser()">Simulate to my pick</button><button onclick="autoPick()">Next AI pick</button>`}</div>`:'<p>Undrafted prospects are now in Free Agency. Advance from Home when ready.</p>'}</div><div class="card"><h3>Selections</h3>${(g.draftPicks||[]).map(x=>`<div class="draft"><b>#${x.pick} ${esc(club(x.club).name)}</b><div class="mini">${esc(x.name)} · ${x.pos} · OVR ${x.ovr}</div></div>`).join('')||'<p class="muted">No selections yet.</p>'}</div>${g.phase==='draft'&&turn?`<div class="card"><h3>Draft board · ${available.length} prospects</h3><p class="mini">Potential is hidden. Player ratings and archetypes are visible; deeper scouting comes in a later update.</p>${available.slice(0,90).map(p=>rowPlayer(p,`<button class="primary" onclick="makePick(${p.id})">Draft</button>`)).join('')}</div>`:''}`}

function switchTab(t){tab=t;render()}function changeClub(id){g.user=Number(id);save();render()}function resetGame(){if(confirm('Start a new career? This overwrites the current browser save.')){fresh();tab='home';render()}}function downloadSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(g)],{type:'application/json'}));a.download='rugby-manager-save-'+g.year+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){if(!g)fresh();updateTheme();if(!g.started){document.getElementById('app').innerHTML=`<div class="top"><div class="logo">◆ ULTIMATE RUGBY LEAGUE MANAGER · 0.3</div></div>${clubSelection()}`;document.getElementById('tabs').innerHTML='';return}document.getElementById('app').innerHTML=`<div class="top"><div><div class="logo">◆ ULTIMATE RUGBY LEAGUE</div><div class="sub">MANAGER · PROTOTYPE 0.3</div></div><div style="width:160px"><select aria-label="Choose club" onchange="changeClub(this.value)">${g.clubs.map(c=>`<option value="${c.id}" ${c.id===g.user?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>${({home,squad,academy:academyView,league,finals:finalsView,draft:draftView,free:freeView,development:reportView}[tab])()}`;document.getElementById('tabs').innerHTML=[['home','Home'],['squad','Squad'],['league','League'],['finals','Finals'],['academy','Academy'],['draft','Draft'],['free','Free Agents'],['development','Progress']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('')}

if(!load())fresh();if(g.phase==='finals')setupFinals();render();
</script></body></html>
